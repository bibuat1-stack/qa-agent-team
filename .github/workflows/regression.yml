# Repository variables: TEST_ENV, API_BASE_URL, UI_BASE_URL, TEST_RUNNER (optional, e.g. self-hosted), NOTIFY_ON_PR.
# Repository secrets: API_TOKEN, UI_USERNAME, UI_PASSWORD, GROKBOT_WEBHOOK_URL, GROKBOT_WEBHOOK_KEY.
name: regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 18 * * *" # 02:30 Asia/Shanghai; GitHub cron uses UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [all, api, ui]
        default: all

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: ${{ vars.TEST_ENV || 'test' }}

jobs:
  api:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'ui'
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.API_BASE_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API tests
        run: >-
          pytest tests/api
          --alluredir=reports/allure-results
          --html=reports/html/api-report.html --self-contained-html
          --junitxml=reports/junit-api.xml
          --reruns 1 --reruns-delay 2
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  ui:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'api'
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: >-
          pytest tests/ui
          --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure
          --output=reports/playwright
          --alluredir=reports/allure-results
          --html=reports/html/ui-report.html --self-contained-html
          --junitxml=reports/junit-ui.xml
          --reruns 1 --reruns-delay 2
      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  allure-report:
    needs: [api, ui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-reports"
          path: downloaded
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          for dir in downloaded/*/allure-results; do
            [ -d "$dir" ] && cp -r "$dir"/. allure-results/
          done
          ls allure-results | head -n 5 || true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Generate Allure HTML report
        run: npx --yes allure-commandline@2 generate allure-results -o allure-report --clean
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  notify-bot:
    needs: [api, ui]
    if: ${{ failure() && (github.event_name != 'pull_request' || vars.NOTIFY_ON_PR == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-reports"
          path: downloaded
      - name: Send failure summary to the Grok Bot routine webhook
        env:
          GROKBOT_WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          GROKBOT_WEBHOOK_KEY: ${{ secrets.GROKBOT_WEBHOOK_KEY }}
          API_RESULT: ${{ needs.api.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          if [ -z "$GROKBOT_WEBHOOK_URL" ] || [ -z "$GROKBOT_WEBHOOK_KEY" ]; then
            echo "Webhook secrets are not set; skipping notification."
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, os, re, urllib.request
          import xml.etree.ElementTree as ET

          failures = []
          for path in sorted(glob.glob("downloaded/*/junit-*.xml")):
              suite = os.path.basename(path)[6:-4]
              for case in ET.parse(path).getroot().iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  message = (problem.get("message") or problem.text or "").strip().splitlines()
                  first = re.sub(r"(?i)(bearer|basic)\s+\S+", r"\1 ***", message[0] if message else "")[:300]
                  failures.append({"suite": suite, "test": f"{case.get('classname')}::{case.get('name')}", "message": first})

          env = os.environ
          run_url = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}"
          payload = {
              "source": "github-actions",
              "repo": env["GITHUB_REPOSITORY"],
              "run_url": run_url,
              "run_attempt": env.get("GITHUB_RUN_ATTEMPT"),
              "event": env["GITHUB_EVENT_NAME"],
              "ref": env["GITHUB_REF_NAME"],
              "sha": env["GITHUB_SHA"],
              "jobs": {"api": env["API_RESULT"], "ui": env["UI_RESULT"]},
              "failure_count": len(failures),
              "failures": failures[:30],
          }
          request = urllib.request.Request(
              env["GROKBOT_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode(),
              headers={"Authorization": f"Bearer {env['GROKBOT_WEBHOOK_KEY']}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Grok Bot webhook status:", response.status)
          PY
