[pytest]
testpaths = tests
# 仓库根目录加入 sys.path，用例可以直接 import config / common / pages。
pythonpath = .
# importlib 模式下 tests/api/<模块>/ 与 tests/ui/<模块>/ 可以有同名测试文件，不需要 __init__.py。
addopts = -ra --strict-markers --import-mode=importlib
markers =
    smoke: 冒烟用例，覆盖核心链路
    regression: 回归用例
    api: 接口用例（tests/api）
    ui: UI 用例（tests/ui，Playwright）
    example_posts: 示例模块：JSONPlaceholder 帖子接口，接入被测系统后替换
    example_home: 示例模块：playwright.dev 首页，接入被测系统后替换
